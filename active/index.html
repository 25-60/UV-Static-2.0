<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Web Proxy</title>
    <!-- Core Ultraviolet Framework Scripts -->
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0; 
            background: #121214; 
            color: #ffffff; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .nav-bar {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 15px auto;
        }
        input { 
            flex: 1;
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #2a2a30; 
            font-size: 16px; 
            background: #1a1a1e;
            color: white;
        }
        input:focus { outline: 2px solid #0070f3; }
        button { 
            padding: 14px 24px; 
            border-radius: 8px; 
            border: none; 
            background: #0070f3; 
            color: white; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
        }
        button:active { background: #0056b3; }
        .frame-container {
            flex: 1;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a30;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <input type="text" id="url-input" placeholder="Search Google or type a URL...">
        <button id="go-btn">Go</button>
    </div>

    <div class="frame-container">
        <iframe id="proxy-frame"></iframe>
    </div>

    <script>
        // 1. Force register Ultraviolet's Service Worker safely
        window.addEventListener('load', async () => {
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register(__uv$config.sw, {
                        scope: __uv$config.prefix
                    });
                    console.log("Ultraviolet Engine Active.");
                } catch (err) {
                    console.error("Engine failed to initialize:", err);
                }
            } else {
                console.error("Service workers are not supported by this browser/network context.");
            }
        });

        // 2. Process search queries or regular URLs
        document.getElementById('go-btn').addEventListener('click', () => {
            let query = document.getElementById('url-input').value.trim();
            if (!query) return;

            // Fixed search string query constructor 🛠️
            if (!query.includes('.') || query.includes(' ')) {
                query = 'https://google.com' + encodeURIComponent(query);
            } else if (!query.startsWith('http://') && !query.startsWith('https://')) {
                query = 'https://' + query;
            }

            try {
                // Ensure proper path structures with fallback root references
                const origin = window.location.origin;
                const prefix = __uv$config.prefix;
                const encoded = __uv$config.encodeUrl(query);
                
                const proxyLink = origin + prefix + encoded;
                console.log("Navigating to proxy target:", proxyLink);
                document.getElementById('proxy-frame').src = proxyLink;
            } catch (err) {
                alert("Encoding Error: " + err.message + "\nMake sure your uv.config.js is saved correctly.");
            }
        });

        // Allow pressing 'Enter' on iPad keyboard to search
        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('go-btn').click();
        });
    </script>
</body>
</html>
