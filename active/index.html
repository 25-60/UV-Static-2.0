<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Web Proxy</title>
    <!-- Core Framework Handler Scripts -->
    <script src="/uv/uv.bundle.js"></script>
    <script>
        /* 🌟 HARDCODED CONFIGURATION INJECTED DIRECTLY INTO THE HTML TO BYPASS THE SCRIPT BLOCK */
        window.__uv$config = {
            prefix: '/uv/service/',
            wisp: 'wss://wisp.mercuryworkshop.xyz/', 
            encodeUrl: function(str) {
                if (!str) return str;
                return encodeURIComponent(str.split('').map((char, i) => i % 2 ? String.fromCharCode(char.charCodeAt(0) ^ 2) : char).join(''));
            },
            decodeUrl: function(str) {
                if (!str) return str;
                return decodeURIComponent(str).split('').map((char, i) => i % 2 ? String.fromCharCode(char.charCodeAt(0) ^ 2) : char).join('');
            },
            handler: '/uv/uv.handler.js',
            client: '/uv/uv.client.js',
            bundle: '/uv/uv.bundle.js',
            config: '/uv/uv.config.js',
            sw: '/uv/uv.sw.js',
        };
    </script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0; 
            background: #121214; 
            color: #ffffff; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .nav-bar {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 15px auto;
        }
        input { 
            flex: 1;
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #2a2a30; 
            font-size: 16px; 
            background: #1a1a1e;
            color: white;
        }
        input:focus { outline: 2px solid #0070f3; }
        button { 
            padding: 14px 24px; 
            border-radius: 8px; 
            border: none; 
            background: #0070f3; 
            color: white; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
        }
        button:active { background: #0056b3; }
        .frame-container {
            flex: 1;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a30;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <input type="text" id="url-input" placeholder="Search Google or type a URL...">
        <button id="go-btn">Go</button>
    </div>

    <div class="frame-container">
        <iframe id="proxy-frame"></iframe>
    </div>

    <script>
        // 1. Force register safely using our hardcoded object reference
        window.addEventListener('load', async () => {
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register(window.__uv$config.sw, {
                        scope: window.__uv$config.prefix
                    });
                    console.log("Ultraviolet Engine Active.");
                } catch (err) {
                    console.error("Engine configuration blocked:", err);
                }
            }
        });

        // 2. Process search queries or regular URLs
        document.getElementById('go-btn').addEventListener('click', () => {
            let query = document.getElementById('url-input').value.trim();
            if (!query) return;

            // Clean fallback to a standard Google search path
            if (!query.includes('.') || query.includes(' ')) {
                query = 'https://google.com' + encodeURIComponent(query);
            } else if (!query.startsWith('http://') && !query.startsWith('https://')) {
                query = 'https://' + query;
            }

            try {
                const origin = window.location.origin;
                const prefix = window.__uv$config.prefix;
                const encoded = window.__uv$config.encodeUrl(query);
                
                const proxyLink = origin + prefix + encoded;
                document.getElementById('proxy-frame').src = proxyLink;
            } catch (err) {
                alert("Execution Error: " + err.message);
            }
        });

        // Keyboard support
        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('go-btn').click();
        });
    </script>
</body>
</html>
